# Snippet to add to the existing clockin-system nginx site config
# (/etc/nginx/sites-available/clockin) alongside the `location /pettycash`
# and `location /uniforms` blocks — see
# petty-cash-tracker/deploy/nginx-clockin-with-pettycash.conf for the full
# file this lives in.
#
# Asset Register — separate Next.js app (systemd service `asset-register`,
# port 3003), sharing this site's login/session via clockin-system's
# `users`/`sessions` tables. Must come before the catch-all `location /`
# block so nginx's longest-prefix match picks it for anything under
# /assetregister.
#
# After adding, reload nginx:
#   sudo nginx -t && sudo systemctl reload nginx

location /assetregister {
    proxy_pass http://localhost:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
